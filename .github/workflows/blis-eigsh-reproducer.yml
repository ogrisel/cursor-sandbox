name: BLIS macOS arm64 randomized-eigsh reproducer

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "blis_eigsh_reproducer/**"
      - ".github/workflows/blis-eigsh-reproducer.yml"
  push:
    branches:
      - main
    paths:
      - "blis_eigsh_reproducer/**"
      - ".github/workflows/blis-eigsh-reproducer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Controls: the numpy-eigsh reproducer must PASS on non-buggy backends.
  controls:
    name: numpy-eigsh-${{ matrix.blas_impl }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        blas_impl: [openblas, newaccelerate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
      - name: Verify numpy-eigsh reproducer (${{ matrix.blas_impl }})
        shell: bash -el {0}
        run: |
          chmod +x blis_eigsh_reproducer/*.sh
          ./blis_eigsh_reproducer/ci_verify_eigsh_reproducer.sh "${{ matrix.blas_impl }}" numpy-eigsh

  # Diagnostic: numpy-eigsh on BLIS across thread counts (timeout-guarded), to
  # learn whether BLIS reproduces the bug as a numerical mismatch or hangs, and
  # at which thread count.
  blis-sweep-numpy:
    name: blis-sweep-numpy-eigsh
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
      - name: Sweep BLIS thread counts (numpy-eigsh)
        shell: bash -el {0}
        env:
          LEVEL: numpy-eigsh
          TIMEOUT_SECS: "120"
        run: |
          chmod +x blis_eigsh_reproducer/*.sh
          ./blis_eigsh_reproducer/ci_sweep_eigsh_blis.sh

  # Diagnostic: the actual upstream pytest on BLIS across thread counts, to
  # confirm how the upstream test behaves on this runner (numerical vs hang).
  blis-sweep-pytest:
    name: blis-sweep-pytest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
      - name: Sweep BLIS thread counts (upstream pytest)
        shell: bash -el {0}
        env:
          LEVEL: pytest
          TIMEOUT_SECS: "120"
        run: |
          chmod +x blis_eigsh_reproducer/*.sh
          ./blis_eigsh_reproducer/ci_sweep_eigsh_blis.sh
