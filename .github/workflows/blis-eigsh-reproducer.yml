name: BLIS macOS arm64 fixed-data GEMM reproducer

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "blis_eigsh_reproducer/**"
      - ".github/workflows/blis-eigsh-reproducer.yml"
  push:
    branches:
      - main
    paths:
      - "blis_eigsh_reproducer/**"
      - ".github/workflows/blis-eigsh-reproducer.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python-fixed-data:
    name: python-fixed-data-${{ matrix.blas_impl }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        blas_impl: [blis, openblas, newaccelerate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
      - name: Run fixed-data Python reproducer (${{ matrix.blas_impl }})
        shell: bash -el {0}
        run: |
          chmod +x blis_eigsh_reproducer/*.sh
          ./blis_eigsh_reproducer/ci_minimal_gemm_python.sh "${{ matrix.blas_impl }}"

  c-fixed-data:
    name: c-fixed-data-${{ matrix.blas_impl }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        blas_impl: [blis, openblas, newaccelerate]
    steps:
      - uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          init-shell: bash
      - name: Build and run fixed-data C reproducer (${{ matrix.blas_impl }})
        shell: bash -el {0}
        run: |
          chmod +x blis_eigsh_reproducer/*.sh
          ./blis_eigsh_reproducer/ci_minimal_gemm_c.sh "${{ matrix.blas_impl }}"
