name: Render k-means fusion report

on:
  push:
    paths:
      - "kmeans_lloyd/**"
      - ".github/workflows/kmeans-report.yml"
  pull_request:
    paths:
      - "kmeans_lloyd/**"
      - ".github/workflows/kmeans-report.yml"

concurrency:
  group: kmeans-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU tests
        working-directory: kmeans_lloyd
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.0" "array-api-compat>=1.11" pytest
          python -m pytest tests
      - name: Render HTML journal
        working-directory: kmeans_lloyd
        run: python scripts/render_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: kmeans-report
          path: kmeans_lloyd/site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        working-directory: kmeans_lloyd
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not configured. The HTML artifact is the rendered site."
            exit 0
          fi
          branch="main"
          if [ -n "$PR_NUMBER" ]; then
            branch="pr-${PR_NUMBER}"
          fi
          npx --yes wrangler@3 pages deploy site \
            --project-name=kmeans-lloyd-fusion \
            --branch="$branch" \
            --commit-dirty=true
