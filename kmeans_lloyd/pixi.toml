[workspace]
name = "kmeans-lloyd-fusion"
version = "0.1.0"
description = "Lloyd k-means iteration and CUDA kernel-fusion experiments"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.2,<3"
matplotlib = ">=3.9"
pytest = "*"
array-api-compat = ">=1.11"
pip = "*"

[pypi-dependencies]
torch = { version = "==2.14.1", index = "https://download.pytorch.org/whl/cu130" }
cupy-cuda13x = "==14.2.0"

[activation.env]
PYTHONPATH = "src"
NVIDIA_TF32_OVERRIDE = "0"

[tasks]
test = "pytest tests"
probe = "python scripts/run_experiments.py probe"
bench = "python scripts/run_experiments.py bench"
all = "python scripts/run_experiments.py all"
