[project]
authors = [{name = "Cursor Agent", email = "cursoragent@cursor.com"}]
dependencies = ["numpy>=2.2", "pandas>=2.2", "scikit-learn>=1.6", "skrub>=0.5"]
name = "workspace"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
workspace = { path = ".", editable = true }

