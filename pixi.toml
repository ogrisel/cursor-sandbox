[workspace]
authors = ["Cursor Agent <cursoragent@cursor.com>"]
channels = ["conda-forge"]
name = "workspace"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.13.*"
numpy = ">=2.5.4,<3"
scipy = ">=1.18.1,<2"
joblib = ">=1.6.0,<2"
threadpoolctl = ">=3.7.0,<4"
cython = "3.1.4.*"
meson-python = ">=0.22.1,<0.23"
ninja = ">=1.13.2,<2"
c-compiler = ">=2.0.0,<3"
cxx-compiler = ">=2.0.0,<3"
pytest = ">=9.1.1,<10"
pytest-xdist = ">=3.8.0,<4"
psutil = ">=7.2.2,<8"
pandas = ">=3.0.6,<4"
pyarrow = ">=25.0.0,<26"
matplotlib = ">=3.11.2,<4"
pip = ">=26.2.1,<27"
ruff = ">=0.17.0,<0.18"

[pypi-dependencies]
torch = ">=2.14.1, <3"
ml-dtypes = ">=0.6.0, <0.7"
